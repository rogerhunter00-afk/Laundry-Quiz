<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f2f22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Browse A Link Between Worlds Guide</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f6ef;background:#07110d;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#163f2d 0,#09150f 38%,#050a07 100%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    button,input{font:inherit}.app{max-width:820px;margin:0 auto;min-height:100vh}.top{position:sticky;top:0;z-index:4;padding:16px;background:linear-gradient(#07110df7,#07110de6 82%,transparent);backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:12px;padding-right:78px}.crest{width:44px;height:44px;border-radius:14px;background:#d6b65f;color:#112418;display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 8px 30px #0008}.brand h1{font-size:19px;margin:0}.brand p{margin:2px 0 0;color:#aec3b7;font-size:13px}.back{position:absolute;right:16px;top:20px;border:1px solid #31583f;background:#13271d;color:#fff;border-radius:10px;padding:8px 10px;text-decoration:none;font-size:12px;font-weight:700}
    .tools{padding:8px 16px 12px}.search{width:100%;border:1px solid #31583f;background:#10231a;color:#fff;border-radius:14px;padding:12px 14px;outline:none}.search:focus{border-color:#d6b65f}.filters{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #31583f;background:#10231a;color:#dbe8df;border-radius:999px;padding:8px 11px;font-size:12px}.filter.active{background:#d6b65f;color:#102116;border-color:#e5ca7d;font-weight:800}.actions{display:flex;gap:8px;margin-top:9px}.btn{border:1px solid #31583f;background:#173125;color:#f2f6f3;border-radius:11px;padding:9px 11px;font-weight:700;font-size:12px}.count{color:#9fb8aa;font-size:12px;margin-top:9px}
    .content{padding:2px 16px 42px}.section{margin:18px 0}.section h2{font-size:15px;color:#d6b65f;margin:0 0 9px}.entry{border:1px solid #294936;background:#0d1d15d9;border-radius:15px;margin:8px 0;overflow:hidden}.entry[open]{background:#10231a}.entry summary{cursor:pointer;list-style:none;padding:13px 42px 13px 14px;font-weight:800;position:relative;line-height:1.3}.entry summary::-webkit-details-marker{display:none}.entry summary::after{content:'＋';position:absolute;right:14px;top:11px;color:#d6b65f;font-size:20px}.entry[open] summary::after{content:'−'}.entry .body{padding:0 14px 14px;color:#dce7e0;line-height:1.55;font-size:14px}.tags{padding:0 14px 11px;color:#89a493;font-size:11px}.empty{padding:28px;text-align:center;color:#9fb8aa}.note{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:#12251b;border:1px solid #294936;color:#b7c8be;font-size:12px;line-height:1.45}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><div class="crest">▲</div><div><h1>Browse the Guide</h1><p>A Link Between Worlds · works without the AI</p></div></div>
      <a class="back" href="./">Chat</a>
    </header>
    <div class="note">This guide is stored inside the app and can be read offline. It does not need WebGPU or the local AI model.</div>
    <section class="tools">
      <input id="search" class="search" type="search" placeholder="Search dungeon, boss, item, collectible…" autocomplete="off" />
      <div class="filters" id="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="walkthrough">Walkthrough</button>
        <button class="filter" data-filter="bosses">Bosses</button>
        <button class="filter" data-filter="items">Items & travel</button>
        <button class="filter" data-filter="collectibles">Collectibles & upgrades</button>
      </div>
      <div class="actions"><button id="expand" class="btn">Expand all</button><button id="collapse" class="btn">Collapse all</button></div>
      <div id="count" class="count"></div>
    </section>
    <section id="content" class="content"></section>
  </main>
  <script type="module" src="./guide.js"></script>
</body>
</html>
